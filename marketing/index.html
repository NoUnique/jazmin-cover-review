<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta property="og:title" content="쎄뇨라유 · 도서 홍보물 검토"><meta property="og:description" content="상세페이지 · 카드뉴스 · 서평 이벤트 · 전체 수정 이력"><meta property="og:image" content="https://nounique.github.io/jazmin-cover-review/marketing/versions/v3/detail/001.jpg"><title>쎄뇨라유 · 홍보물과 수정 이력</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef1ec;color:#102844;font:16px/1.65 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}header,main,.bar{max-width:1160px;margin:auto;padding:24px}header{padding-top:35px}h1{font-size:32px;margin:12px 0}h2{margin:8px 0}p{margin:8px 0}a{color:inherit;text-underline-offset:3px}button,select{font:inherit;color:inherit}button,.link{display:inline-block;background:white;border:1px solid #93afa4;border-radius:7px;padding:10px 16px;cursor:pointer;text-decoration:none}button[aria-pressed=true]{background:#102844;color:white;border-color:#102844}.sticky{position:sticky;top:0;background:#fffffff2;border-bottom:1px solid #d1ded5;z-index:4;backdrop-filter:blur(10px)}.bar{display:flex;gap:10px;flex-wrap:wrap;padding-top:12px;padding-bottom:12px}.versionline{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px;background:#fff;border-radius:8px;margin-bottom:18px}select{padding:8px;border:1px solid #93afa4;border-radius:5px;background:white}.note{background:white;padding:20px;margin-bottom:20px;border-left:4px solid #9bc9be}.muted{color:#536b66;font-size:14px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.detail{max-width:900px;margin:auto}.detail img{display:block;width:100%;height:auto}.cards,.history{display:grid;grid-template-columns:1fr 1fr;gap:24px}article{background:white;padding:18px;border-radius:10px}article img,.banner img{width:100%;height:auto;display:block}.history img{height:420px;object-fit:cover;object-position:top}.tag{display:inline-block;background:#e2efe8;border-radius:20px;padding:3px 12px;font-size:13px}.section[hidden]{display:none}.history article{display:flex;flex-direction:column;gap:10px}.history .actions{margin-top:auto}footer{max-width:1160px;margin:30px auto;padding:24px;color:#536b66;font-size:13px}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #dd9d80;outline-offset:3px}@media(max-width:650px){header,main{padding:20px 14px}h1{font-size:27px}.bar{padding:10px 12px;gap:7px}.bar button{padding:8px 12px;font-size:14px}.cards,.history{grid-template-columns:1fr}.history img{height:350px}.versionline{align-items:flex-start}}
.versionline[hidden]{display:none}</style></head><body><header><a href="../">← 표지 후보와 수정 이력</a><h1>쎄뇨라유 · 도서 홍보물</h1><p>상세페이지, 카드뉴스, 서평 이벤트 배너를 확인하고 이전 작업과 비교할 수 있습니다.</p></header><div class="sticky"><nav class="bar" aria-label="홍보물 종류"><button data-tab="detail">상세페이지</button><button data-tab="cards">카드뉴스</button><button data-tab="event">서평 이벤트</button><button data-tab="history">수정 이력</button></nav></div><main><div class="versionline" id="versionline"><label for="version">작업 버전</label><select id="version"><option value="v3">3차 · 누끼·가독성·아이콘 정리 (최신)</option><option value="v2">2차 · 예시 반영</option><option value="v1">1차 · 최초 구성</option></select><button id="copylink">현재 화면 링크 복사</button><span id="copy-status" role="status" class="muted"></span></div><section id="detail" class="section"></section><section id="cards" class="section" hidden></section><section id="event" class="section" hidden></section><section id="history" class="section" hidden></section></main><footer>검토용 페이지 · JPG 원본을 눌러 확대할 수 있습니다. 이전 버전의 이미지는 별도로 보존합니다.</footer><script>
const data={"latest": "v3", "versions": [{"id": "v3", "title": "3차 · 누끼·가독성·아이콘 정리", "date": "2026-09-16", "count": 8, "height": 11490, "note": "화장 수정본은 제외하고 기존 누끼 사진을 사용했습니다. 목업과 배경을 교체하고, 본문 글꼴과 크기·행간을 정리했습니다. 모든 상세페이지 아이콘은 같은 윤곽선·크기·색 체계로 통일했습니다. 목차와 저자 소개는 크게 읽을 수 있도록 별도 구간으로 구성했습니다. 카드뉴스와 서평 이벤트에도 같은 책 목업과 글꼴을 반영했습니다."}, {"id": "v2", "title": "2차 · 예시 반영", "date": "2026-09-16", "count": 7, "height": 10480, "note": "첨부 예시의 중앙 책 목업, 원형 배지, 손글씨, 살구색 소개 영역, 저자 사진과 목차 구성을 반영했습니다. 강의·학습자·내지 소개를 같은 스타일로 확장했습니다."}, {"id": "v1", "title": "1차 · 최초 구성", "date": "2026-09-16", "count": 8, "height": 11050, "note": "책 소개·목차·강의·추천 학습자·저자 소개·실제 내지를 8개 구간으로 구성한 최초 작업입니다."}]};
let version='v3',tab='detail';const byId=x=>document.getElementById(x);const tabs=['detail','cards','event','history'];
function render(){const media=version==='v3'?'versions/v3':'shared';const v=data.versions.find(x=>x.id===version);byId('version').value=version;document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tab===tab)));tabs.forEach(x=>byId(x).hidden=x!==tab);byId('versionline').hidden=tab==='history';
byId('detail').innerHTML=`<div class="note"><span class="tag">${v.title}${v.id===data.latest?' · 최신':''}</span><p>${v.note}</p><p class="muted">${v.date} · 1080 × ${v.height}px · ${v.count}장 분할본</p><div class="actions"><a class="link" href="versions/${v.id}/detail/detail-full-1080.jpg" download>긴 상세 이미지 받기</a><a class="link" href="versions/${v.id}/upload-images.zip" download>이 버전의 JPG 묶음 받기</a></div></div><div class="detail">${Array.from({length:v.count},(_,i)=>{const n=String(i+1).padStart(3,'0');return `<a href="versions/${v.id}/detail/${n}.jpg" target="_blank" rel="noopener"><img src="versions/${v.id}/detail/${n}.jpg" alt="${v.title} 상세페이지 ${i+1}" loading="lazy"></a>`}).join('')}</div>`;
byId('cards').innerHTML=`<div class="note"><h2>카드뉴스</h2><p>001~004는 요청한 4장 구성입니다. 교보 제출 시 005를 추가하면 총 5장이 됩니다.</p><p class="muted">700 × 700px · 선택한 작업 버전의 이미지입니다.</p></div><div class="cards">${[1,2,3,4,5].map(i=>{const n=String(i).padStart(3,'0');return `<article><h3>${n}${i===5?' · 교보용 보충':''}</h3><a href="${media}/cards/${n}.jpg" target="_blank" rel="noopener"><img src="${media}/cards/${n}.jpg" alt="카드뉴스 ${i}" loading="lazy"></a><a href="${media}/cards/${n}.jpg" download>JPG 다운로드</a></article>`}).join('')}</div>`;
byId('event').innerHTML=`<div class="note"><h2>서평 이벤트 배너</h2><p>1200 × 600px · 참여 안내와 구글폼 링크는 게시물 본문에 추가합니다.</p><p class="muted">선택한 작업 버전의 배너입니다.</p><a class="link" href="${media}/banner/review-event-1200x600.jpg" download>배너 JPG 받기</a></div><div class="banner"><img src="${media}/banner/review-event-1200x600.jpg" alt="서평 이벤트 배너"></div>`;
byId('history').innerHTML='<div class="note"><h2>전체 수정 이력</h2><p>최신본과 최초 작업을 각각 열어볼 수 있습니다. 버전별 링크를 그대로 공유해도 됩니다.</p></div><div class="history">'+data.versions.map(v=>`<article><span class="tag">${v.title}${v.id===data.latest?' · 최신':''}</span><a href="#${v.id}/detail"><img src="versions/${v.id}/detail/001.jpg" alt="${v.title} 첫 화면"></a><p>${v.note}</p><p class="muted">${v.date} · 상세페이지 ${v.count}장</p><div class="actions"><a class="link" href="#${v.id}/detail">이 버전 보기</a><a class="link" href="versions/${v.id}/upload-images.zip" download>JPG 묶음</a></div></article>`).join('')+'</div>';
}
function readHash(){const [v,t]=location.hash.slice(1).split('/');version=data.versions.some(x=>x.id===v)?v:data.latest;tab=tabs.includes(t)?t:'detail';render()}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>location.hash=version+'/'+b.dataset.tab);byId('version').onchange=e=>location.hash=e.target.value+'/'+tab;window.addEventListener('hashchange',readHash);byId('copylink').onclick=async()=>{try{await navigator.clipboard.writeText(location.href.split('#')[0]+'#'+version+'/'+tab);byId('copy-status').textContent='링크를 복사했습니다.'}catch(e){byId('copy-status').textContent='주소창의 링크를 복사해 주세요.'}};readHash();
</script></body></html>
